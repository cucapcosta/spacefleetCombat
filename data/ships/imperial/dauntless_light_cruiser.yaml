id: dauntless_light_cruiser
name: "Dauntless-class Light Cruiser"
classification: light_cruiser
faction: imperial_navy
hull_cost: 80
leadership: 6
commander_level_required: 2
upkeep: 8
description: >
  Fast and agile, the Dauntless is the eyes and teeth of the Imperial Navy.
  Its versatile prow weapon bay can be configured for lance strikes or
  additional gunnery, making it adaptable to any tactical situation.

hull:
  hits: 4
  length: 3.5
  armor_prow: 6
  armor_port: 5
  armor_starboard: 5
  armor_stern: 4

movement:
  speed: 25
  turn_rate: 60
  turn_delay: 8
  combustion_max: 80

shields: 1
turrets: 1

subsystems:
  - generator
  - engines

weapon_slots:
  - id: 1
    name: "Port Battery"
    arc: port
    size: medium
    allowed_types: [battery]

  - id: 2
    name: "Starboard Battery"
    arc: starboard
    size: medium
    allowed_types: [battery]

  - id: 3
    name: "Prow Weapon Bay"
    arc: prow
    size: medium
    allowed_types: [battery, lance]

upgrade_slots: 2
doctrine_slot: true

default_loadout:
  weapons:
    1: macro_cannon_2
    2: macro_cannon_2
    3: lance_2
  upgrades: []
  doctrine: null

boarding:
  assault_actions: 1

morale:
  base_max: 100
