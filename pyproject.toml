[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spacefleet-combat"
version = "0.1.0"
description = "A CLI tactical spaceship combat game inspired by Battlefleet Gothic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "lnker" },
]
keywords = ["game", "cli", "spaceship", "combat", "tactical", "battlefleet"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0",
    "aiohttp>=3.9",
    "certifi",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pyinstaller>=6.0",
]

[project.scripts]
spacefleet = "spacefleet.__main__:main"
spacefleet-server = "spacefleet.net.server:main"
spacefleet-client = "spacefleet.net.client:main"
spacefleet-ws-server = "spacefleet.net.ws_server:main"
spacefleet-ws-client = "spacefleet.net.ws_client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spacefleet"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
